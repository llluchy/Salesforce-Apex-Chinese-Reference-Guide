<a name="apex_canvas_ApplicationContext_getCanvasUrl"><!-- --></a><h1 class="helpHead1">getCanvasUrl()</h1><div class="body refbody">
<div class="shortdesc"><span class="ph" id="shortdesc"><a name="shortdesc"><!-- --></a>Retrieves the fully qualified URL of
the canvas app.</span></div>

<div class="section">
<h2 class="helpHead2">Signature</h2>
<p class="p"><samp class="codeph apex_code"><span class="keyword">public</span> <span class="keyword">String</span> getCanvasUrl()</samp></p>
</div>

<div class="section">
<h2 class="helpHead2">Return Value</h2>
<p class="p">Type: <a class="xref" href="atlas.en-us.apexref.meta/apexref/apex_methods_system_string.htm#apex_methods_system_string" title="Contains methods for the String primitive data type.">String</a></p>
</div>

<div class="section">
<h2 class="helpHead2">Usage</h2>
<p class="p">Use this method to get the
URL of the canvas app, for example: <span class="ph filepath">http://instance.salesforce.com:8080/canvas_app_path/canvas_app.jsp</span>.</p>
</div>
