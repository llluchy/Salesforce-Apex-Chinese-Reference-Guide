<a name="apex_connectapi_output_batch_result_get_error_message"><!-- --></a><h1 class="helpHead1">getErrorMessage()</h1><div class="body refbody">
<div class="shortdesc"><span class="ph" id="shortdesc"><a name="shortdesc"><!-- --></a>Returns a String that contains an error
message.</span></div>

<div class="section">
<h2 class="helpHead2">Signature</h2>
<p class="p"><samp class="codeph apex_code"><span class="keyword">public</span> <span class="keyword">String</span> getErrorMessage()</samp></p>
</div>

<div class="section">
<h2 class="helpHead2">Return Value</h2>
<p class="p">Type: String</p>
</div>

<div class="section">
<h2 class="helpHead2">Usage</h2>
<p class="p">The error message doesn’t make a round trip through a Visualforce view state, because
                exceptions can’t be serialized.</p>
</div>
