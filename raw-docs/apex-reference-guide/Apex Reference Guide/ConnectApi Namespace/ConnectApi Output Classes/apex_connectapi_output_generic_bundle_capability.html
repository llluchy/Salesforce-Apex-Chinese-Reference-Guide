<a name="apex_connectapi_output_generic_bundle_capability"><!-- --></a><h1 class="helpHead1">ConnectApi.GenericBundleCapability</h1><div class="body refbody">
<div class="shortdesc"><span class="ph" id="shortdesc"><a name="shortdesc"><!-- --></a>If a feed element has this capability, the feed element has a group of
   other feed elements condensed into one feed element. This group is called a
   <dfn class="term">bundle</dfn>.</span></div>

<div class="section"><div class="p">Subclass of <a class="xref" href="atlas.en-us.apexref.meta/apexref/apex_connectapi_output_abstract_bundle_capability.htm" title="If a feed element has this capability, it has a container of feed elements called a bundle.">ConnectApi.BundleCapability</a>.</div></div>
