<a name="connectapi_examples_post_comment_feed_element"><!-- --></a><h1 class="helpHead1">Post a Comment</h1><div class="body refbody">
<div class="shortdesc">Call a method to post a comment.</div>

    <div class="section"><div class="p">Call <a class="xref" href="https://developer.salesforce.com/docs/atlas.en-us.262.0.apexref.meta/apexref/apex_ConnectAPI_ChatterFeeds_static_methods.htm#apex_ConnectAPI_ChatterFeeds_postCommentToFeedElement_1" target="_blank"><samp class="codeph apex_code">postCommentToFeedElement(communityId, feedElementId, text)</samp></a> to post a
      plain text comment to a feed
      element.<div class="codeSection apex_code"><pre class="codeblock brush:apex">ConnectApi.Comment comment = ConnectApi.ChatterFeeds.postCommentToFeedElement(<span class="keyword">null</span>, <span class="string">'0D5D0000000KuGh'</span>, <span class="string">'I agree with the proposal.'</span> );</pre></div>
</div></div>
