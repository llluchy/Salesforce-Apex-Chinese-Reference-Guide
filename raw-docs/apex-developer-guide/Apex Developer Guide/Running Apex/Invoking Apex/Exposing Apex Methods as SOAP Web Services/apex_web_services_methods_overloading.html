<a name="apex_web_services_methods_overloading"><!-- --></a><h1 class="helpHead1">Overloading Web Service Methods</h1><div class="body">
<p class="p">SOAP and WSDL do not provide good support for overloading methods. Consequently, Apex does not
allow two methods marked with the <samp class="codeph apex_code">webservice</samp> keyword to
have the same name. Web service methods that have the same name in the same class generate a
compile-time error.</p>
