<a name="apex_classes_annotations_rest"><!-- --></a><h1 class="helpHead1">Apex REST Annotations</h1><div class="body">
  <div class="p" id="RESTAnnotationsList">
<a name="RESTAnnotationsList"><!-- --></a>Use these annotations to expose an Apex class as a RESTful Web
                service.<a name="RestAnnotations"><!-- --></a><ul class="ul bulletList" id="RestAnnotations">
                <li class="li"><a class="xref" href="atlas.en-us.apexcode.meta/apexcode/apex_classes_annotation_ReadOnly.htm"><samp class="codeph apex_code"><span class="keyword">@ReadOnly</span></samp></a></li>

                <li class="li">
<a class="xref" href="atlas.en-us.apexcode.meta/apexcode/apex_classes_annotation_rest_resource.htm"><samp class="codeph apex_code"><span class="keyword">@RestResource</span></samp></a><samp class="codeph apex_code">(urlMapping=<span class="string">'/</span><var class="keyword varname">yourUrl</var><span class="string">')</span></samp>
</li>

                <li class="li"><a class="xref" href="atlas.en-us.apexcode.meta/apexcode/apex_classes_annotation_http_delete.htm"><samp class="codeph apex_code"><span class="keyword">@HttpDelete</span></samp></a></li>

                <li class="li"><a class="xref" href="atlas.en-us.apexcode.meta/apexcode/apex_classes_annotation_http_get.htm"><samp class="codeph apex_code"><span class="keyword">@HttpGet</span></samp></a></li>

                <li class="li"><a class="xref" href="atlas.en-us.apexcode.meta/apexcode/apex_classes_annotation_http_patch.htm"><samp class="codeph apex_code"><span class="keyword">@HttpPatch</span></samp></a></li>

                <li class="li"><a class="xref" href="atlas.en-us.apexcode.meta/apexcode/apex_classes_annotation_http_post.htm"><samp class="codeph apex_code"><span class="keyword">@HttpPost</span></samp></a></li>

                <li class="li"><a class="xref" href="atlas.en-us.apexcode.meta/apexcode/apex_classes_annotation_http_put.htm"><samp class="codeph apex_code"><span class="keyword">@HttpPut</span></samp></a></li>

            </ul>
</div>
