<a name="apex_classes_annotation_http_post"><!-- --></a><h1 class="helpHead1">HttpPost Annotation</h1><div class="body">
        <p class="p">The <samp class="codeph apex_code"><span class="keyword">@HttpPost</span></samp> annotation is used at the method
            level and enables you to expose an Apex method as a REST resource. This method is called
            when an HTTP <samp class="codeph nolang">POST</samp> request is sent, and creates a
            new resource.</p>

        <p class="p">To use this annotation, your Apex method must be defined as global static.</p>

    </div>
